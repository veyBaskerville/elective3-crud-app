<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD File Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body {
      background-color: #f9f9f9;
    }
    .modal-header {
      background-color: #007bff;
      color: white;
    }
    .preview-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 5px;
    }
  </style>
</head>
<body class="p-4">

  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>📂 File Manager (CRUD with MySQL)</h3>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">Add File</button>
    </div>

    <table class="table table-bordered table-striped align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Preview</th>
          <th>File Name</th>
          <th>Size</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="fileTableBody">
        <!-- dynamically filled -->
      </tbody>
    </table>
  </div>

  <!-- Add Modal -->
  <div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New File</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addForm">
            <div class="mb-3">
              <label for="addName" class="form-label">File Name</label>
              <input type="text" class="form-control" id="addName" required>
            </div>
            <div class="mb-3">
              <label for="addImage" class="form-label">Choose Image</label>
              <input type="file" class="form-control" id="addImage" accept="image/*" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Add File</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Update Modal -->
  <div class="modal fade" id="updateModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-warning">
          <h5 class="modal-title">Update File</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="updateForm">
            <input type="hidden" id="updateId">
            <div class="mb-3">
              <label for="updateName" class="form-label">File Name</label>
              <input type="text" class="form-control" id="updateName" required>
            </div>
            <div class="mb-3">
              <label for="updateImage" class="form-label">Change Image (optional)</label>
              <input type="file" class="form-control" id="updateImage" accept="image/*">
            </div>
            <button type="submit" class="btn btn-warning w-100">Update File</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">Confirm Delete</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <p>Are you sure you want to delete this file?</p>
          <button id="confirmDeleteBtn" class="btn btn-danger me-2">Yes, Delete</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = 'http://localhost:3000/api/items';
    let currentDeleteId = null;

    async function fetchFiles() {
      const res = await axios.get(API_URL);
      const tbody = document.getElementById('fileTableBody');
      tbody.innerHTML = '';

      res.data.forEach(file => {
        tbody.innerHTML += `
          <tr>
            <td>${file.id}</td>
            <td><img src="${file.description}" class="preview-img"></td>
            <td>${file.name}</td>
            <td>${(Math.random() * 1000).toFixed(2)} KB</td>
            <td>
              <button class="btn btn-sm btn-warning me-1" onclick="openUpdate(${file.id}, '${file.name}')">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="openDelete(${file.id})">Delete</button>
            </td>
          </tr>`;
      });
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('addName').value;
      const file = document.getElementById('addImage').files[0];
      const imageURL = URL.createObjectURL(file);

      await axios.post(API_URL, { name, description: imageURL });
      document.getElementById('addForm').reset();
      bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
      fetchFiles();
    });

    function openUpdate(id, name) {
      document.getElementById('updateId').value = id;
      document.getElementById('updateName').value = name;
      new bootstrap.Modal(document.getElementById('updateModal')).show();
    }

    document.getElementById('updateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('updateId').value;
      const name = document.getElementById('updateName').value;
      const file = document.getElementById('updateImage').files[0];
      const imageURL = file ? URL.createObjectURL(file) : null;

      await axios.put(`${API_URL}/${id}`, {
        name,
        description: imageURL || undefined
      });
      bootstrap.Modal.getInstance(document.getElementById('updateModal')).hide();
      fetchFiles();
    });

    function openDelete(id) {
      currentDeleteId = id;
      new bootstrap.Modal(document.getElementById('deleteModal')).show();
    }

    document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
      await axios.delete(`${API_URL}/${currentDeleteId}`);
      bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
      fetchFiles();
    });

    fetchFiles();
  </script>
</body>
</html>
